# VajraNet AI Security Policy Baseline
# Sector: Government Administrative & Civic Services
# Authority: CERT-In / Sovereign Cybersecurity Directive 2026-GOV

policy_id: "POL-GOV-2026"
name: "Government Secure VPN Baseline"
sector: "Government"
version: "2.4.0"
status: "Active"
description: "Mandatory configuration standards for state and central government inter-departmental IPsec VPN links."

cryptographic_standards:
  approved_ike_versions:
    - "IKEv2"
  disallowed_ike_versions:
    - "IKEv1"
  approved_ciphers:
    - "AES-256-GCM"
    - "CHACHA20-POLY1305"
  deprecated_ciphers:
    - "AES-CBC-128"
    - "3DES"
    - "DES"
  approved_integrity:
    - "AEAD-integrated"
    - "HMAC-SHA384"
    - "HMAC-SHA256"
  deprecated_integrity:
    - "MD5"
    - "SHA1"
  pfs_required: true
  minimum_dh_group: 14  # MODP 2048 or ECP 256/384

tunnel_parameters:
  max_sa_lifetime_seconds: 28800  # 8 hours maximum
  recommended_sa_lifetime_seconds: 14400 # 4 hours
  anti_replay_window_minimum: 64
  require_dead_peer_detection: true
  dpd_timeout_seconds: 30

metadata_leakage_controls:
  max_packet_size_fingerprinting_risk: "Medium"
  anti_traffic_analysis_padding_recommended: false
  permitted_nat_traversal: true

evidence_requirements:
  require_gateway_telemetry_for_pfs_verification: true
  zero_payload_decryption_mandate: true
